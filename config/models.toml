# Explicit routing. Enable live calls only after approved canary/isolation gates.
[default]
provider = "codex"
live_enabled = false

[deepseek]
model = "deepseek-flash"
judge_max_tokens = 512
distiller_max_tokens = 4096

[judge]
provider = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "medium"
max_tokens = 512
temperature = 0.0

